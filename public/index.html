<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dialectic - Two-LLM Debate Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="aurora aurora-one"></div>
    <div class="aurora aurora-two"></div>

    <main class="layout">
      <section class="panel setup-panel">
        <h1>Dialectic</h1>
        <p class="subtitle">Run a structured debate between two LLMs, then read full turns or a balanced synthesis.</p>

        <div class="setup-tabs" role="tablist" aria-label="Setup Sections">
          <button type="button" class="setup-tab active" data-setup-tab="debate">Debate</button>
          <button type="button" class="setup-tab" data-setup-tab="saved">Saved Debates</button>
        </div>

        <section id="setup-view-debate" class="setup-view">
          <form id="debate-form">
          <div class="section-heading">Debate Setup</div>

          <label>
            Debate Type
            <select name="debateType" id="debate-type" required>
              <option value="motion">Motion (for vs against)</option>
              <option value="choice">A vs B</option>
            </select>
          </label>

          <label>
            Core Question / Motion
            <textarea
              name="question"
              id="question"
              rows="3"
              placeholder="Example: Is homeopathy an actual science?"
              required
            ></textarea>
          </label>

          <div id="choice-options" class="choice-options hidden">
            <label>
              Option A
              <input name="optionA" id="option-a" type="text" placeholder="Nature" />
            </label>
            <label>
              Option B
              <input name="optionB" id="option-b" type="text" placeholder="Nurture" />
            </label>
          </div>

          <label>
            Max Rounds
            <input name="maxRounds" id="max-rounds" type="number" min="1" max="20" value="6" />
          </label>

          <details class="config-collapsible">
            <summary>Model Connectors</summary>
            <div class="config-collapsible-body">
              <div class="model-grid">
                <article class="model-card">
                  <h2 id="for-card-title">For the Motion / Option A</h2>
                  <label>
                    Provider
                    <select name="forProvider" id="for-provider" required>
                      <option value="openai">OpenAI</option>
                      <option value="anthropic">Claude (Anthropic)</option>
                      <option value="ollama">Ollama (Local)</option>
                    </select>
                  </label>
                  <label>
                    Model
                    <input name="forModel" id="for-model" type="text" placeholder="gpt-5-nano" required />
                  </label>
                  <label>
                    API Key (optional if set in server env)
                    <input name="forApiKey" id="for-api-key" type="password" placeholder="sk-..." autocomplete="new-password" />
                  </label>
                  <label>
                    Base URL (optional)
                    <input name="forBaseUrl" id="for-base-url" type="text" placeholder="https://api.openai.com/v1" />
                  </label>
                </article>

                <article class="model-card">
                  <h2 id="against-card-title">Against the Motion / Option B</h2>
                  <label>
                    Provider
                    <select name="againstProvider" id="against-provider" required>
                      <option value="openai">OpenAI</option>
                      <option value="anthropic">Claude (Anthropic)</option>
                      <option value="ollama">Ollama (Local)</option>
                    </select>
                  </label>
                  <label>
                    Model
                    <input name="againstModel" id="against-model" type="text" placeholder="claude-3-5-sonnet-latest" required />
                  </label>
                  <label>
                    API Key (optional if set in server env)
                    <input name="againstApiKey" id="against-api-key" type="password" placeholder="sk-ant-..." autocomplete="new-password" />
                  </label>
                  <label>
                    Base URL (optional)
                    <input name="againstBaseUrl" id="against-base-url" type="text" placeholder="https://api.anthropic.com" />
                  </label>
                </article>
              </div>
            </div>
          </details>

          <details class="config-collapsible">
            <summary>Summary Settings</summary>
            <div class="config-collapsible-body">
              <label class="inline-check">
                <input type="checkbox" id="skip-summary" />
                Skip summary generation
              </label>

              <label class="inline-check">
                <input type="checkbox" id="separate-summary-model" />
                Use a separate summarizer model
              </label>

              <label class="inline-check">
                <input type="checkbox" id="save-debate" checked />
                Save this debate to local file storage
              </label>

              <div class="summary-model hidden" id="summary-model-area">
                <label>
                  Summary Provider
                  <select id="summary-provider">
                    <option value="openai">OpenAI</option>
                    <option value="anthropic">Claude (Anthropic)</option>
                    <option value="ollama">Ollama (Local)</option>
                  </select>
                </label>
                <label>
                  Summary Model
                  <input id="summary-model" type="text" placeholder="gpt-5-nano" />
                </label>
                <label>
                  Summary API Key (optional)
                  <input id="summary-api-key" type="password" placeholder="sk-..." autocomplete="new-password" />
                </label>
                <label>
                  Summary Base URL (optional)
                  <input id="summary-base-url" type="text" placeholder="https://api.openai.com/v1" />
                </label>
              </div>
            </div>
          </details>

          <button type="submit" id="run-button">Run Debate</button>
          <p id="status" class="status idle">Ready.</p>
          </form>
        </section>

        <section id="setup-view-saved" class="setup-view hidden">
          <div class="saved-debates">
            <div class="section-heading section-inline">
              <span>Saved Debates</span>
              <button type="button" id="refresh-saved" class="ghost-button">Refresh</button>
            </div>
            <div id="saved-list" class="saved-list"></div>
          </div>
        </section>
      </section>

      <section class="panel output-panel">
        <div class="output-header">
          <h2>Results</h2>
          <div class="tabs">
            <button type="button" class="tab active" data-tab="transcript">Transcript</button>
            <button type="button" class="tab" data-tab="summary">Summary</button>
          </div>
        </div>

        <div id="meta" class="meta"></div>
        <div id="live-status" class="live-status hidden"></div>

        <section id="transcript" class="tab-content"></section>
        <section id="summary" class="tab-content hidden"></section>
      </section>
    </main>
    <p class="maker-note">Made with ❤️ by Aditya</p>

    <script type="module" src="./app.js"></script>
  </body>
</html>
